<!-- ============================================ -->
<!-- Modal: Add Property -->
<!-- ============================================ -->
<div id="addPropertyModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <div class="modal-header-title">
                <div class="modal-header-title-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <h3>Add New Property</h3>
            </div>
            <button class="modal-close-btn" onclick="closeAddPropertyModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="addPropertyForm" class="modal-body" onsubmit="event.preventDefault();">
            <div class="modal-form-grid">
                <!-- Row 1 -->
                <div class="form-group">
                    <label>Property Address <span class="required">*</span></label>
                    <input type="text" class="form-control" placeholder="Enter Property Address" required>
                </div>
                <div class="form-group">
                    <label>Property Type <span class="required">*</span></label>
                    <select class="form-control" required>
                        <option value="">Select Property Type</option>
                        <option value="flat">Flat</option>
                        <option value="house">House</option>
                        <option value="apartment">Apartment</option>
                        <option value="bungalow">Bungalow</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Property Status <span class="required">*</span></label>
                    <select class="form-control" required>
                        <option value="">Select Property Status</option>
                        <option value="available">Available</option>
                        <option value="occupied">Occupied</option>
                        <option value="maintenance">Under Maintenance</option>
                    </select>
                </div>
                <!-- Row 2 -->
                <div class="form-group">
                    <label>Rent Price <span class="required">*</span></label>
                    <input type="number" class="form-control" placeholder="Enter Rent Amount" required>
                </div>
                <div class="form-group">
                    <label>Landlord <span class="required">*</span></label>
                    <select class="form-control" required>
                        <option value="">Select Landlord</option>
                        <option value="1">John Smith</option>
                        <option value="2">Jane Doe</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tenant</label>
                    <input type="text" class="form-control" placeholder="Search for Tenant Name (Optional)">
                </div>
                <!-- Row 3 -->
                <div class="form-group">
                    <label>Gas Certificate Date <span class="required">*</span></label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>EPC Due Date <span class="required">*</span></label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Electric Certificate Date <span class="required">*</span></label>
                    <input type="date" class="form-control" required>
                </div>
            </div>
        </form>
        <div class="modal-footer">
            <button type="button" class="modal-btn modal-btn-reset" onclick="resetAddPropertyForm()">
                <i class="fa-solid fa-xmark"></i> Reset
            </button>
            <button type="button" class="modal-btn modal-btn-save" onclick="saveProperty()">
                <i class="fa-solid fa-plus"></i> Add 
            </button>
        </div>
    </div>
</div>
